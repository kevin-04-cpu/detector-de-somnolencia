<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Detector de somnolencia</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="stage" id="stage">
    <video id="video" autoplay playsinline muted></video>
    <img id="photo" alt="Imagen seleccionada" hidden />
    <canvas id="overlay"></canvas>

    <div class="empty" id="empty">
      <p id="emptyText">Toca el botón para encender la cámara frontal</p>
      <button class="btn-text" id="startCam">Encender cámara</button>
    </div>
  </main>

  <header class="top">
    <span class="chip" id="faceChip">Sin rostro</span>
    <span class="chip muted" id="apiChip">Sin modelo</span>
  </header>

  <section class="sheet" id="sheet" hidden>
    <div class="sheet-row">
      <div>
        <p class="sheet-label">Resultado</p>
        <h2 id="resTitle">—</h2>
      </div>
      <p class="sheet-conf" id="resConf">—</p>
    </div>
    <div class="meter"><div id="meterFill"></div></div>
    <p class="sheet-desc" id="resDesc"></p>
    <dl class="sheet-meta">
      <div><dt>Apertura ojos (EAR)</dt><dd id="resEar">—</dd></div>
      <div><dt>Fuente</dt><dd id="resSource">—</dd></div>
    </dl>
    <button class="btn-text" id="closeSheet">Volver a la cámara</button>
  </section>

  <nav class="controls">
    <label class="ctl" title="Elegir imagen de la galería">
      <input type="file" id="fileInput" accept="image/*" hidden />
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg>
    </label>
    <button class="shutter" id="shutter" aria-label="Capturar y analizar" disabled><span></span></button>
    <button class="ctl" id="toggleCam" title="Apagar / encender cámara">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
    </button>
  </nav>

  <canvas id="work" hidden></canvas>
  <script type="module" src="app.js"></script>
</body>
</html>
